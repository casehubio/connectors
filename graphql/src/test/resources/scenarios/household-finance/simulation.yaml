# Household finance scenario — simulation config
#
# Exercises BankPlatform and EmailPlatform SPIs together.
# Place on classpath (src/main/resources/ or src/test/resources/)
# for convention discovery by SimulationRuntime.

default-tenancy-id: household

methods:
  # --- Bank Platform (AccountInformation) ---
  bank-platform.id:
    strategy: constant
    corpus:
      - input: null
        output: "sim"

  bank-platform.accountInformation.listAccounts:
    strategy: seq
    corpus-files:
      - classpath:simulation/bank-feed/accounts-corpus.yaml

  bank-platform.accountInformation.balance:
    strategy: key
    key-extractor: "field:accountId"
    corpus-files:
      - classpath:simulation/bank-feed/accounts-corpus.yaml

  bank-platform.accountInformation.listTransactions:
    strategy: seq
    exhaustion-policy: WRAP
    corpus-files:
      - classpath:simulation/bank-feed/transactions-corpus.yaml

  bank-platform.accountInformation.getTransaction:
    strategy: key
    key-extractor: "field:transactionId"
    corpus-files:
      - classpath:simulation/bank-feed/transactions-corpus.yaml

  # --- Bank Platform (PaymentInitiation) ---
  bank-platform.paymentInitiation.initiatePayment:
    strategy: seq
    corpus-files:
      - classpath:simulation/bank-feed/payments-corpus.yaml

  bank-platform.paymentInitiation.paymentStatus:
    strategy: key
    key-extractor: "field:paymentId"
    corpus-files:
      - classpath:simulation/bank-feed/payments-corpus.yaml

  # --- Email Platform ---
  email-platform.id:
    strategy: constant
    corpus:
      - input: null
        output: "sim"

  email-platform.listMailboxes:
    strategy: seq
    corpus-files:
      - classpath:simulation/email/mailbox-corpus.yaml

  email-platform.listMessages:
    strategy: seq
    exhaustion-policy: WRAP
    corpus-files:
      - classpath:simulation/email/mailbox-corpus.yaml

  email-platform.getMessage:
    strategy: key
    key-extractor: "field:messageId"
    corpus-files:
      - classpath:simulation/email/messages-corpus.yaml

  email-platform.getAttachmentContent:
    strategy: key
    key-extractor: "field:attachmentId"
    corpus-files:
      - classpath:simulation/email/messages-corpus.yaml
