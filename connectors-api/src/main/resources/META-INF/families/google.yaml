family:
  id: google
  description: "Google Workspace — shared OAuth2 consent"
  consent: incremental
  oauth:
    auth-url: "https://accounts.google.com/o/oauth2/v2/auth"
    token-url: "https://oauth2.googleapis.com/token"
    redirect-uri: "{callback-base-url}/oauth/callback/google"
    scopes:
      - "https://www.googleapis.com/auth/calendar.readonly"
      - "https://www.googleapis.com/auth/calendar.events"
      - "https://www.googleapis.com/auth/drive.readonly"
      - "https://www.googleapis.com/auth/drive.file"
      - "https://www.googleapis.com/auth/gmail.readonly"
      - "https://www.googleapis.com/auth/gmail.modify"
      - "https://www.googleapis.com/auth/contacts.readonly"
      - "https://www.googleapis.com/auth/contacts"
    access-type: offline
    prompt: consent
  fields:
    - name: client-id
      sensitive: false
      description: "Google OAuth2 client ID"
      help: "Google Cloud Console → APIs & Services → Credentials → OAuth 2.0 Client IDs"
    - name: client-secret
      description: "Google OAuth2 client secret"
      help: "Found alongside the client ID in the Google Cloud Console"
