# TrueLayer OIDC client (named "truelayer") — for client credentials grant
quarkus.oidc-client.truelayer.auth-server-url=https://auth.truelayer.com
quarkus.oidc-client.truelayer.client-id=${TRUELAYER_CLIENT_ID:}
quarkus.oidc-client.truelayer.credentials.secret=${TRUELAYER_CLIENT_SECRET:}
quarkus.oidc-client.truelayer.grant.type=client_credentials

# TrueLayer connector configuration
casehub.connectors.bank.truelayer.base-url=https://api.truelayer.com
casehub.connectors.bank.truelayer.auth-url=https://auth.truelayer.com
casehub.connectors.bank.truelayer.client-id=${TRUELAYER_CLIENT_ID:}
casehub.connectors.bank.truelayer.client-secret=${TRUELAYER_CLIENT_SECRET:}
