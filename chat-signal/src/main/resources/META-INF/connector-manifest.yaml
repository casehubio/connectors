connector:
  id: signal
  platform: chat
  description: "Signal via signal-cli-rest-api"
  auth:
    type: phone-verify
    fields:
      - name: api-url
        sensitive: false
        description: "signal-cli-rest-api base URL"
        help: "The URL where your signal-cli-rest-api Docker container is running"
        example: "http://localhost:8080"
      - name: number
        sensitive: false
        description: "Signal phone number (E.164 format)"
        help: "The phone number to register with Signal — must be able to receive SMS"
        example: "+447700900001"
  produces:
    - class: io.casehub.connectors.signal.cli.SignalClient
      type: client
      constructor-args:
        - field: api-url
    - class: io.casehub.connectors.chat.signal.SignalChatPlatform
      type: platform
      constructor-args:
        - bean: io.casehub.connectors.signal.cli.SignalClient
        - field: api-url
        - field: number
    - class: io.casehub.connectors.chat.signal.SignalInboundConnector
      type: inbound-connector
      constructor-args:
        - bean: io.casehub.connectors.signal.cli.SignalClient
        - field: api-url
        - field: number
    - class: io.casehub.connectors.chat.signal.SignalInboundTranslator
      type: translator
  provides:
    - capability: chat
      sub: [messaging, discovery, members, reactions, channel-management, member-management]
  requires:
    - capability: sms
      sub: [receive]
      reason: "SMS verification code during registration"
  setup-playbook: playbooks/signal-registration.yaml
  health:
    endpoint: "{api-url}/v1/about"
    interval: "30s"
