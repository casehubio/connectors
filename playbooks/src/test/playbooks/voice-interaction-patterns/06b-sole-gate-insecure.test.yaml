name: "NEGATIVE TWIN: cloned voice bypasses voice-only gate"
---
name: cloned voice passes speaker identification and authorises payment
---
- run-playbook: 06b-sole-gate-insecure
  capture: run
- assertThat: run.error
  equals: ""
- assertThat: run.captures.speakerId
  matches:
    identified: true
    name: Bob Smith
- assertThat: run.captures.auditRecord.ok
  equals: true
