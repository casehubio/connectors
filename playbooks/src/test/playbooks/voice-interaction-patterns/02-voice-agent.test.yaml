name: Voice agent tests
simulate:
  agent:
    corpus:
      - prompt: balance
        response: BALANCE
---
name: agent classifies transcribed voice input
---
- run-playbook: ../../../main/playbooks/voice-interaction-patterns/02-voice-agent.playbook.yaml
  capture: run
- assertThat: run.error
  equals: ""
- assertThat: run.succeeded
  equals: true
- assertThat: run.captures.transcript.text
  contains: check my account balance
- assertThat: run.captures.classification.response
  contains: BALANCE
- assertThat: run.captures.audio.audio-format
  equals: wav
