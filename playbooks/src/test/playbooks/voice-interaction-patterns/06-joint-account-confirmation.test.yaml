name: Joint account verbal confirmation tests
---
name: multi-factor gate — voice ID and reference number both required
---
- run-playbook: 06-joint-account-confirmation
  capture: run
- assertThat: run.error
  equals: ""
- assertThat: run.captures.aliceId.identified
  equals: true
- assertThat: run.captures.bobId.identified
  equals: true
- assertThat: run.captures.fullTranscript.text
  contains: "7,429"
- assertThat: run.captures.combinedRecording.audio-format
  equals: wav
- assertThat: run.captures.fullTranscript.text
  contains: confirm
