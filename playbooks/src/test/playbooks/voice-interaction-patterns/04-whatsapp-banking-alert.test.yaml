name: WhatsApp banking alert tests
---
name: bank balance sent as voice message with transcript follow-up
---
- run-playbook: 04-whatsapp-banking-alert
  capture: run
- assertThat: run.error
  equals: ""
- assertThat: run.captures.balance
  matches:
    accountId: acc-100
    currency: GBP
- assertThat: run.captures.voiceSummary.audio-format
  equals: wav
- assertThat: run.captures.notification.ok
  equals: true
- assertThat: run.captures.transcript.text
  contains: balance
- assertThat: run.captures.followUp.ok
  equals: true
