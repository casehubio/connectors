name: Email voice notification tests
---
name: inbox voice alert with transcript follow-up
---
- run-playbook: ../../../main/playbooks/voice-interaction-patterns/05-email-voice-notification.playbook.yaml
  capture: run
- assertThat: run.error
  equals: ""
- assertThat: run.succeeded
  equals: true
- assertThat: run.captures.inbox.count
  greaterThan: 0
- assertThat: run.captures.voiceAlert.audio-format
  equals: wav
- assertThat: run.captures.notification.ok
  equals: true
- assertThat: run.captures.transcript.text
  contains: messages in your inbox
- assertThat: run.captures.followUp.ok
  equals: true
