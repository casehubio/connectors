name: Banking voice assistant tests
---
name: bank balance retrieved and spoken as voice
---
- run-playbook: 03-banking-assistant
  capture: run
- assertThat: run.error
  equals: ""
- assertThat: run.captures.balance
  matches:
    accountId: acc-100
    currency: GBP
    amount: 3245.67
- assertThat: run.captures.audio.audio-format
  equals: wav
