name: Banking voice assistant tests
---
name: bank balance retrieved and spoken as voice
---
- run-playbook: ../../../main/playbooks/voice-interaction-patterns/03-banking-assistant.playbook.yaml
  capture: run
- assertThat: run.error
  equals: ""
- assertThat: run.succeeded
  equals: true
- assertThat: run.captures.balance.accountId
  equals: acc-100
- assertThat: run.captures.balance.currency
  equals: GBP
- assertThat: run.captures.balance.amount
  not-null: true
- assertThat: run.captures.audio.audio-format
  equals: wav
