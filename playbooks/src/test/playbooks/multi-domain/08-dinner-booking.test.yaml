name: Dinner out tests
---
name: find restaurant, get directions, SMS and chat notify
---
- run-playbook: ../../../main/playbooks/multi-domain/08-dinner-booking.playbook.yaml
  capture: run
- assertThat: run.error
  equals: ""
- assertThat: run.succeeded
  equals: true
# Restaurant found
- assertThat: run.captures.restaurant.name
  not-null: true
# Directions calculated
- assertThat: run.captures.directions.duration.text
  not-null: true
# SMS sent
- assertThat: run.captures.smsNotification.ok
  equals: true
# Chat notification sent
- assertThat: run.captures.chatNotification.ok
  equals: true
