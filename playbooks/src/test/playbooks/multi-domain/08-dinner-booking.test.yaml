name: Dinner out tests
tests:
  - name: find restaurant, get directions, SMS and chat notify
    steps:
      - run-playbook: ../../../main/playbooks/multi-domain/08-dinner-booking.playbook.yaml
        capture: result
      - assertThat: result.error
        equals: ""
      - assertThat: result.succeeded
        equals: true
      # Restaurant found
      - assertThat: result.captures.restaurant.name
        not-null: true
      # Directions calculated
      - assertThat: result.captures.directions.duration.text
        not-null: true
      # SMS sent
      - assertThat: result.captures.smsNotification.ok
        equals: true
      # Chat notification sent
      - assertThat: result.captures.chatNotification.ok
        equals: true
