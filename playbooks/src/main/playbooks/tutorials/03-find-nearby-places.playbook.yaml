name: Find nearby restaurants
description: Get current position, search for restaurants nearby, then get details of the first result
---
- location-device-position:
    platform: ref
  capture: myLocation

- location-search-by-category:
    platform: ref
    category: restaurant
    lat: ${myLocation.location.lat}
    lng: ${myLocation.location.lng}
    radius-meters: 2000
  capture: nearby

- location-place-details:
    platform: ref
    place-id: ${nearby.items[0].id}
  capture: place
