name: Dinner out — find restaurant, get directions, notify
description: Find nearby Thai restaurant, get walking directions, send details via SMS and chat
steps:
  # 1. Find Thai restaurants nearby (London coordinates)
  - location-search-nearby:
      latitude: 51.5074
      longitude: -0.1278
      category: restaurant
      keyword: thai
      radius: 1000
    capture: restaurants

  # 2. Get details of the top result
  - location-place-details:
      placeId: ${restaurants.items[0].placeId}
    capture: restaurant

  # 3. Get walking directions
  - location-directions:
      origin: "51.5074,-0.1278"
      destination: ${restaurant.address}
      mode: WALKING
    capture: directions

  # 4. SMS the details to ourselves
  - mobile-send-sms:
      to: "+447700900000"
      body: >
        Found: ${restaurant.name}, ${restaurant.address}.
        Walk time: ${directions.duration}. Phone: ${restaurant.phone}.
    capture: smsNotification

  # 5. Chat notification
  - chat-send:
      channel: personal
      message: >
        Dinner option found. ${restaurant.name} —
        ${restaurant.address}. ${directions.duration} walk.
    capture: chatNotification
