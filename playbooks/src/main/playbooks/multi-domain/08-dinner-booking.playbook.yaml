name: Dinner out — find restaurant, get directions, notify
description: Find nearby restaurant, get walking directions, send details via SMS and chat
steps:
  # 1. Find restaurants nearby (Balham coordinates — matches location-ref seed data)
  - location-search-by-category:
      category: restaurant
      lat: 51.4430
      lng: -0.1525
      radiusMeters: 2000
    capture: restaurants

  # 2. Get details of the top result
  - location-place-details:
      placeId: ${restaurants.items[0].id}
    capture: restaurant

  # 3. Get walking directions from Balham station
  - location-directions:
      originLat: 51.4432
      originLng: -0.1522
      destLat: ${restaurant.location.lat}
      destLng: ${restaurant.location.lng}
      mode: WALKING
    capture: directions

  # 4. SMS the details
  - mobile-send-sms:
      platform: ref
      to: "+447700900000"
      body: >
        Found: ${restaurant.name}, ${restaurant.formattedAddress}.
        Walk: ${directions.duration.text}. Phone: ${restaurant.formattedPhoneNumber}.
    capture: smsNotification

  # 5. Chat notification
  - chat-send:
      channel: personal
      text: >
        Dinner option: ${restaurant.name} —
        ${restaurant.formattedAddress}. ${directions.duration.text} walk.
    capture: chatNotification
