name: Joint account verbal confirmation
description: Register voices, receive confirmations, denoise, identify speakers — gate on identification before sending to compliance
steps:
  # 1. Register voiceprints from sample audio
  - tts-synthesise:
      text: Hello, I am Alice
      voice: af_heart
    capture: aliceSample

  - speaker register:
      name: Alice Smith
      audio: ${aliceSample.audio-data}

  - tts-synthesise:
      text: Hello, I am Bob
      voice: bm_daniel
    capture: bobSample

  - speaker register:
      name: Bob Smith
      audio: ${bobSample.audio-data}

  # 2. Receive confirmation messages
  - tts-synthesise:
      text: I, Alice Smith, confirm this transaction of 500 pounds
      voice: af_heart
    capture: aliceMessage

  - tts-synthesise:
      text: I, Bob Smith, confirm this transaction of 500 pounds
      voice: bm_daniel
    capture: bobMessage

  # 3. Denoise each recording
  - audio-denoise:
      audio: ${aliceMessage.audio-data}
    capture: aliceClean

  - audio-denoise:
      audio: ${bobMessage.audio-data}
    capture: bobClean

  # 4. Identify speakers
  - speaker identify:
      audio: ${aliceClean.audio-data}
    capture: aliceId

  - speaker identify:
      audio: ${bobClean.audio-data}
    capture: bobId

  # 5. Join and transcribe (always — needed for audit either way)
  - audio join:
      first: ${aliceClean.audio-data}
      second: ${bobClean.audio-data}
    capture: combinedRecording

  - stt-transcribe: ${combinedRecording.audio-data}
    capture: fullTranscript

  # 6. Gate on identification — both must be verified before compliance
  - if: ${aliceId.identified}
    then:
      - if: ${bobId.identified}
        then:
          - chat-send:
              channel: compliance
              message: "Both ${aliceId.name} and ${bobId.name} identified by voice and authorised the payment. Transcript: ${fullTranscript.text}"
              attachment: ${combinedRecording.audio-data}
              attachment-type: audio/wav
              attachment-name: joint-authorisation.wav
            capture: auditRecord
        else:
          - chat-send:
              channel: compliance
              message: "Voice identification failed for second speaker — authorisation incomplete. Transcript preserved: ${fullTranscript.text}"
            capture: auditRecord
          - chat-send:
              channel: family
              message: "Your joint account authorisation could not be completed — voice identification failed. Please contact your branch."
            capture: participantNotice
    else:
      - chat-send:
          channel: compliance
          message: "Voice identification failed for first speaker — authorisation incomplete. Transcript preserved: ${fullTranscript.text}"
        capture: auditRecord
      - chat-send:
          channel: family
          message: "Your joint account authorisation could not be completed — voice identification failed. Please contact your branch."
        capture: participantNotice
