name: "NEGATIVE TWIN: cloned voice bypasses voice-only payment gate"
description: Demonstrates the attack that multi-factor prevents — an attacker uses a cloned voice (same TTS voice as the victim) to pass speaker identification and authorise a payment with no second factor to catch the clone.
rules:
  - speaker identification alone does not authorise a payment
  - "VIOLATION: this playbook intentionally breaks the rule above to demonstrate the vulnerability"
---
# 1. Register Bob's voiceprint
- tts-synthesise:
    text: Hello, I am Bob
    voice: bm_daniel
  capture: bobSample

- speaker register:
    name: Bob Smith
    audio: ${bobSample.audio-data}
    supported-sample-rates: [16000, 24000]

# 2. Attacker uses cloned voice (same bm_daniel voice) to impersonate Bob
- tts-synthesise:
    text: I, Bob Smith, confirm this transaction of 500 pounds
    voice: bm_daniel
  capture: attackerMessage

# 3. Denoise
- audio-denoise:
    audio: ${attackerMessage.audio-data}
  capture: attackerClean

# 4. Identify speaker — sole gate (INSECURE)
#    The cloned voice matches Bob's voiceprint
- speaker identify:
    audio: ${attackerClean.audio-data}
    supported-sample-rates: [16000, 24000]
  capture: speakerId

# 5. Transcribe for audit
- stt-transcribe: ${attackerClean.audio-data}
  capture: transcript

# 6. Gate on voice ID ONLY — no second factor
#    The clone passes. No reference number or OTP to catch the impersonation.
- if: ${speakerId.identified}
  then:
    - chat-send:
        channel: compliance
        message: "Payment authorised by voice identification only. Speaker: ${speakerId.name}. Transcript: ${transcript.text}"
      capture: auditRecord
  else:
    - chat-send:
        channel: compliance
        message: "Voice identification failed — payment blocked."
      capture: auditRecord
