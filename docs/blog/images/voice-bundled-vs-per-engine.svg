<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-auto">
      <path d="M 0 0 L 10 3.5 L 0 7 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Left side: Bundled approach -->
  <text x="200" y="24" text-anchor="middle" font-size="14" font-weight="600" fill="#dc2626">Bundled (rejected)</text>

  <rect x="100" y="40" width="200" height="120" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="200" y="62" text-anchor="middle" font-weight="600" fill="#991b1b">SherpaVoicePlatform</text>
  <line x1="120" y1="72" x2="280" y2="72" stroke="#fca5a5" stroke-width="1"/>
  <text x="200" y="92" text-anchor="middle" fill="#7f1d1d" font-size="12">Kokoro TTS</text>
  <text x="200" y="112" text-anchor="middle" fill="#7f1d1d" font-size="12">+ Whisper STT</text>
  <text x="200" y="140" text-anchor="middle" fill="#b91c1c" font-size="11" font-style="italic">coupled — can't swap either</text>

  <rect x="60" y="200" width="120" height="44" rx="6" fill="#fff" stroke="#d1d5db" stroke-width="1"/>
  <text x="120" y="226" text-anchor="middle" fill="#374151" font-size="12">Kokoro TTS</text>

  <rect x="220" y="200" width="120" height="44" rx="6" fill="#fff" stroke="#d1d5db" stroke-width="1"/>
  <text x="280" y="226" text-anchor="middle" fill="#374151" font-size="12">Whisper STT</text>

  <line x1="170" y1="160" x2="135" y2="200" stroke="#64748b" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="230" y1="160" x2="265" y2="200" stroke="#64748b" stroke-width="1" marker-end="url(#arrow)"/>

  <text x="200" y="280" text-anchor="middle" fill="#991b1b" font-size="12">Want OpenAI TTS?</text>
  <text x="200" y="298" text-anchor="middle" fill="#991b1b" font-size="12">Replace the whole platform.</text>

  <!-- Right side: Per-engine approach -->
  <text x="620" y="24" text-anchor="middle" font-size="14" font-weight="600" fill="#059669">Per-engine (chosen)</text>

  <rect x="500" y="40" width="110" height="80" rx="8" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="555" y="62" text-anchor="middle" font-weight="600" fill="#065f46" font-size="12">Kokoro</text>
  <text x="555" y="78" text-anchor="middle" font-weight="600" fill="#065f46" font-size="12">VoicePlatform</text>
  <text x="555" y="100" text-anchor="middle" fill="#047857" font-size="11">TTS only</text>

  <rect x="630" y="40" width="110" height="80" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="685" y="62" text-anchor="middle" font-weight="600" fill="#1e40af" font-size="12">Whisper</text>
  <text x="685" y="78" text-anchor="middle" font-weight="600" fill="#1e40af" font-size="12">VoicePlatform</text>
  <text x="685" y="100" text-anchor="middle" fill="#1d4ed8" font-size="11">STT only</text>

  <rect x="500" y="160" width="110" height="44" rx="6" fill="#fff" stroke="#d1d5db" stroke-width="1"/>
  <text x="555" y="186" text-anchor="middle" fill="#374151" font-size="12">Kokoro TTS</text>

  <rect x="630" y="160" width="110" height="44" rx="6" fill="#fff" stroke="#d1d5db" stroke-width="1"/>
  <text x="685" y="186" text-anchor="middle" fill="#374151" font-size="12">Whisper STT</text>

  <line x1="555" y1="120" x2="555" y2="160" stroke="#64748b" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="685" y1="120" x2="685" y2="160" stroke="#64748b" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Swap illustration -->
  <rect x="500" y="240" width="110" height="44" rx="6" fill="#fef3c7" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="4 2"/>
  <text x="555" y="260" text-anchor="middle" fill="#92400e" font-size="12">OpenAI TTS</text>
  <text x="555" y="274" text-anchor="middle" fill="#92400e" font-size="10" font-style="italic">swap one</text>

  <text x="620" y="270" text-anchor="middle" fill="#059669" font-size="20">+</text>

  <rect x="630" y="240" width="110" height="44" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="685" y="266" text-anchor="middle" fill="#1d4ed8" font-size="12">Whisper STT</text>

  <text x="620" y="316" text-anchor="middle" fill="#059669" font-size="12">Mix and match freely.</text>

  <!-- Divider -->
  <line x1="410" y1="10" x2="410" y2="330" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="6 3"/>
</svg>
