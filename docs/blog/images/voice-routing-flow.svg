<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 280" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <marker id="arr" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-auto">
      <path d="M 0 0 L 10 3.5 L 0 7 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- voice-config.yaml -->
  <rect x="20" y="90" width="140" height="100" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="90" y="112" text-anchor="middle" font-weight="600" fill="#334155" font-size="12">voice-config.yaml</text>
  <line x1="35" y1="120" x2="145" y2="120" stroke="#cbd5e1" stroke-width="1"/>
  <text x="90" y="140" text-anchor="middle" fill="#475569" font-size="11">tts-vendor: kokoro</text>
  <text x="90" y="156" text-anchor="middle" fill="#475569" font-size="11">stt-vendor: whisper</text>
  <text x="90" y="174" text-anchor="middle" fill="#475569" font-size="11">voices: af_heart...</text>

  <!-- Arrow to router -->
  <line x1="160" y1="140" x2="210" y2="140" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- RoutingVoicePlatformService -->
  <rect x="215" y="70" width="180" height="140" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="305" y="92" text-anchor="middle" font-weight="600" fill="#166534" font-size="11">RoutingVoicePlatform</text>
  <text x="305" y="106" text-anchor="middle" font-weight="600" fill="#166534" font-size="11">Service</text>
  <line x1="230" y1="114" x2="380" y2="114" stroke="#bbf7d0" stroke-width="1"/>
  <text x="305" y="134" text-anchor="middle" fill="#15803d" font-size="11">resolve("af_heart")</text>
  <text x="305" y="152" text-anchor="middle" fill="#15803d" font-size="11">→ vendor lookup</text>
  <text x="305" y="170" text-anchor="middle" fill="#15803d" font-size="11">→ voice descriptor</text>
  <text x="305" y="188" text-anchor="middle" fill="#15803d" font-size="11">→ quality ranking</text>

  <!-- Arrow to TTS platform -->
  <line x1="395" y1="110" x2="460" y2="80" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="435" y="85" text-anchor="middle" fill="#64748b" font-size="10">TTS</text>

  <!-- Arrow to STT platform -->
  <line x1="395" y1="170" x2="460" y2="200" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="435" y="198" fill="#64748b" font-size="10">STT</text>

  <!-- KokoroVoicePlatform -->
  <rect x="465" y="40" width="140" height="80" rx="8" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="535" y="62" text-anchor="middle" font-weight="600" fill="#065f46" font-size="12">KokoroVoicePlatform</text>
  <line x1="480" y1="70" x2="590" y2="70" stroke="#a7f3d0" stroke-width="1"/>
  <text x="535" y="88" text-anchor="middle" fill="#047857" font-size="11">id: "kokoro"</text>
  <text x="535" y="104" text-anchor="middle" fill="#047857" font-size="11">supports: TTS</text>

  <!-- WhisperVoicePlatform -->
  <rect x="465" y="160" width="140" height="80" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="535" y="182" text-anchor="middle" font-weight="600" fill="#1e40af" font-size="12">WhisperVoicePlatform</text>
  <line x1="480" y1="190" x2="590" y2="190" stroke="#bfdbfe" stroke-width="1"/>
  <text x="535" y="208" text-anchor="middle" fill="#1d4ed8" font-size="11">id: "whisper"</text>
  <text x="535" y="224" text-anchor="middle" fill="#1d4ed8" font-size="11">supports: STT</text>

  <!-- Arrow to Kokoro engine -->
  <line x1="605" y1="80" x2="650" y2="80" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Arrow to Whisper engine -->
  <line x1="605" y1="200" x2="650" y2="200" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Kokoro engine -->
  <rect x="655" y="50" width="110" height="60" rx="6" fill="#fefce8" stroke="#fde047" stroke-width="1"/>
  <text x="710" y="72" text-anchor="middle" font-weight="600" fill="#854d0e" font-size="11">Kokoro TTS</text>
  <text x="710" y="90" text-anchor="middle" fill="#a16207" font-size="10">sherpa-onnx FFM</text>
  <text x="710" y="102" text-anchor="middle" fill="#a16207" font-size="10">28 voices</text>

  <!-- Whisper engine -->
  <rect x="655" y="170" width="110" height="60" rx="6" fill="#fefce8" stroke="#fde047" stroke-width="1"/>
  <text x="710" y="192" text-anchor="middle" font-weight="600" fill="#854d0e" font-size="11">Whisper STT</text>
  <text x="710" y="210" text-anchor="middle" fill="#a16207" font-size="10">sherpa-onnx FFM</text>
  <text x="710" y="222" text-anchor="middle" fill="#a16207" font-size="10">offline batch</text>

  <!-- Title -->
  <text x="390" y="268" text-anchor="middle" font-size="12" fill="#64748b" font-style="italic">voice-config.yaml → routing → per-engine platform → native engine</text>
</svg>
